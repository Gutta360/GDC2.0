@if (scans.length) {
  <div class="scan-list">
    @for (preview of previews; track preview.url) {
      <article class="scan-item">
        <img
          [src]="preview.url"
          [alt]="preview.file.name"
        />
        <div>
          <span>{{ preview.file.name }}</span>
          <small>{{ (preview.file.size / 1024 / 1024) | number:'1.1-1' }} MB</small>
        </div>
        <button type="button" (click)="remove($index)" aria-label="Remove scan">
          Remove
        </button>
      </article>
    }
  </div>
} @else {
  <p class="empty-state">No scans uploaded</p>
}

<label class="upload-button">
  <svg
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path d="M4 8h3l1.4-2h4.2L14 8h2" />
    <path d="M4 8h12v10H4z" />
    <circle cx="10" cy="13" r="3" />
    <path d="M18 5v6" />
    <path d="M15 8h6" />
  </svg>
  <span>Add Scans</span>
  <input
    type="file"
    accept="image/png,image/jpeg,image/webp"
    multiple
    (change)="onFilesSelected($event)"
  />
</label>

@if (errorMessage) {
  <p class="validation-message">{{ errorMessage }}</p>
}
