<section class="pharmacy-page">
  <h1>Medicine Stock</h1>

  <div class="stock-toolbar">
    <label class="search-box">
      <span>⌕</span>
      <input
        type="text"
        placeholder="Search by medicine name"
        [(ngModel)]="search"
        autocomplete="off"
      />
    </label>

    <button type="button" class="primary-button" (click)="add()">＋ Add</button>
  </div>

  <div class="stock-table">
    <div class="table-head">
      <strong>S.No</strong>
      <strong>Medicine Name</strong>
      <strong>Quantity</strong>
      <strong>Expiry Date</strong>
    </div>

    @for (medicine of filteredMedicines; track medicine.medicineId; let index = $index) {
      <button type="button" class="table-row" (click)="edit(medicine)">
        <span>{{ index + 1 }}</span>
        <span>{{ medicine.medicineName }}</span>
        <span>{{ medicine.availableQuantity }}</span>
        <span>{{ medicine.expiryDate }}</span>
      </button>
    } @empty {
      <p class="empty-state">{{ loading ? 'Loading stock...' : 'No medicines found.' }}</p>
    }
  </div>

  <app-medicine-stock-modal
    [open]="modalOpen"
    [medicine]="selectedMedicine"
    [saving]="saving"
    (close)="modalOpen = false"
    (saveStock)="save($event)"
    (deleteStock)="delete()"
  />

  @if (snackbarMessage) {
    <div class="notification-strip" [class.success]="snackbarType === 'success'" [class.error]="snackbarType === 'error'">
      {{ snackbarMessage }}
    </div>
  }
</section>
