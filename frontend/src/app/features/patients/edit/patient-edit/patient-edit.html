<p>patient-edit works!</p>
<section class="edit-page">

  <header class="page-header">

    <h1>
      Edit Patient Details
    </h1>

  </header>


  @if (loadingPatient) {

    <div class="loading-state">
      Loading patient...
    </div>

  } @else if (patient) {

    <!-- Patient ID -->

    <div class="patient-id-field">

      <label>
        Patient ID
      </label>

      <div class="readonly-control">
        {{ patient.patientId }}
      </div>

    </div>


    <!-- Reusable Form -->

    <app-patient-form
      mode="edit"
      [initialData]="patient"
      [loading]="loading"
      (formSubmit)="onPatientUpdate($event)"
    >
    </app-patient-form>


    <button
      type="button"
      class="close-button"
      (click)="close()"
    >
      Close
    </button>

  }

</section>
