<div class="app-shell">

  <header class="main-header">

    <div class="brand">
      GDC
    </div>

    <nav class="main-navigation" aria-label="Main navigation">

      <a
        routerLink="/home"
        routerLinkActive="active"
        class="nav-item home-link"
        aria-label="Home"
        (click)="closeMenu()"
      >
        <svg
          class="home-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M3 10.8L12 3l9 7.8" />
          <path d="M5.5 9.5V21h13V9.5" />
          <path d="M9.5 21v-6.5h5V21" />
        </svg>
      </a>

      <div class="nav-dropdown" [class.open]="isMenuOpen('patients')">
        <button
          type="button"
          class="nav-item nav-toggle"
          [class.active]="isSectionActive(['/patients'])"
          [attr.aria-expanded]="isMenuOpen('patients')"
          aria-controls="patients-menu"
          (click)="toggleMenu('patients')"
        >
          Patient
        </button>

        <div id="patients-menu" class="dropdown-menu">
          <a routerLink="/patients/registration" routerLinkActive="active" class="dropdown-item" (click)="closeMenu()">
            Registration
          </a>
          <a routerLink="/patients/details" routerLinkActive="active" class="dropdown-item" (click)="closeMenu()">
            Patient Details
          </a>
          <a routerLink="/patients/summary" routerLinkActive="active" class="dropdown-item" (click)="closeMenu()">
            Patient Summary
          </a>
        </div>
      </div>

      <div class="nav-dropdown" [class.open]="isMenuOpen('appointments')">
        <button
          type="button"
          class="nav-item nav-toggle"
          [class.active]="isSectionActive(['/appointments'])"
          [attr.aria-expanded]="isMenuOpen('appointments')"
          aria-controls="appointments-menu"
          (click)="toggleMenu('appointments')"
        >
          Appointment
        </button>

        <div id="appointments-menu" class="dropdown-menu">
          <a routerLink="/appointments/calendar" routerLinkActive="active" class="dropdown-item" (click)="closeMenu()">
            Calendar
          </a>
        </div>
      </div>

      <div class="nav-dropdown" [class.open]="isMenuOpen('treatments')">
        <button
          type="button"
          class="nav-item nav-toggle"
          [class.active]="isSectionActive(['/treatments'])"
          [attr.aria-expanded]="isMenuOpen('treatments')"
          aria-controls="treatments-menu"
          (click)="toggleMenu('treatments')"
        >
          Treatment
        </button>

        <div id="treatments-menu" class="dropdown-menu">
          <a
            routerLink="/treatments"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="dropdown-item"
            (click)="closeMenu()"
          >
            Treatment
          </a>
          <a routerLink="/treatments/follow-up" routerLinkActive="active" class="dropdown-item" (click)="closeMenu()">
            Follow Up
          </a>
        </div>
      </div>

      <div class="nav-dropdown" [class.open]="isMenuOpen('payments')">
        <button
          type="button"
          class="nav-item nav-toggle"
          [class.active]="isSectionActive(['/payments'])"
          [attr.aria-expanded]="isMenuOpen('payments')"
          aria-controls="payments-menu"
          (click)="toggleMenu('payments')"
        >
          Payment
        </button>

        <div id="payments-menu" class="dropdown-menu">
          <a
            routerLink="/payments"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="dropdown-item"
            (click)="closeMenu()"
          >
            Payment
          </a>
          <a routerLink="/payments/history" routerLinkActive="active" class="dropdown-item" (click)="closeMenu()">
            History
          </a>
        </div>
      </div>

      <div class="nav-dropdown" [class.open]="isMenuOpen('pharmacy')">
        <button
          type="button"
          class="nav-item nav-toggle"
          [class.active]="isSectionActive(['/pharmacy'])"
          [attr.aria-expanded]="isMenuOpen('pharmacy')"
          aria-controls="pharmacy-menu"
          (click)="toggleMenu('pharmacy')"
        >
          Pharmacy
        </button>

        <div id="pharmacy-menu" class="dropdown-menu">
          <a
            routerLink="/pharmacy"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="dropdown-item"
            (click)="closeMenu()"
          >
            Pharmacy
          </a>
          <a routerLink="/pharmacy/stock" routerLinkActive="active" class="dropdown-item" (click)="closeMenu()">
            Stock
          </a>
        </div>
      </div>

    </nav>

    <button
      type="button"
      class="logout-button"
      aria-label="Logout"
      (click)="logout()"
    >
      ⏻
    </button>

  </header>

  <main class="application-content">
    <router-outlet />
  </main>

</div>
